<div class="plan-grid">
  @for (plano of planos(); track plano.id) {
    <article class="plan-card">
      <h2 class="plan-card__title">
        <a [routerLink]="plano.rota">{{ plano.titulo }}</a>
      </h2>

      <div class="book-covers" aria-label="Livros em destaque">
        @for (imagem of plano.imagens; track imagem) {
          <a
            class="book-cover"
            [routerLink]="plano.rota"
            [attr.aria-label]="'Ver plano: ' + plano.titulo"
          >
            <img [src]="imagem" [alt]="'Capa de livro do plano ' + plano.titulo" loading="lazy">
          </a>
        }
      </div>

      <ul class="plan-card__links">
        @for (link of plano.links.slice(0, 3); track link.label) {
          <li><a [routerLink]="link.rota">{{ link.label }}</a></li>
        }
      </ul>
    </article>
  }
</div>
