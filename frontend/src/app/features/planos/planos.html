<section class="page-container plans-page">
  <header class="page-heading">
    <p class="page-heading__eyebrow">Leitura que cabe na sua rotina</p>
    <h1>Planos de leitura</h1>
    <p>Escolha um ritmo possível para você e transforme alguns minutos do dia em uma nova descoberta.</p>
  </header>
  <div class="time-plan-grid">
    @for (plano of planos; track plano.id) {
      <article class="time-plan-card">
        <p class="time-plan-card__time">{{ plano.tempoDiario }}</p>
        <h2>{{ plano.titulo }}</h2>
        <p class="time-plan-card__description">{{ plano.descricao }}</p>
      </article>
    }
  </div>
</section>
